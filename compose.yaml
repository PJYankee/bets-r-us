services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APPLICATION_HOSTNAME: mongodb
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  mongo_data:
